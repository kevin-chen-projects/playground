]\n        if s < target:\n            lo += 1\n        else:\n            hi -= 1\n    return []\n", "explanation": "Because the array is sorted, a too-small sum means move the left pointer up; too-big means move the right pointer down. Converge in one pass. Time O(n), space O(1).", "tests": "check(\"ex1\", two_sum_sorted([2,7,11,15], 9), [1,2])\ncheck(\"ex2\", two_sum_sorted([2,3,4], 6), [1,3])\ncheck(\"ex3\", two_sum_sorted([-1,0], -1), [1,2])\n"}, {"id": "move-zeroes", "title": "Move Zeroes", "difficulty": "Easy", "category": "Two Pointers", "pattern": "Write pointer packs non-zeros forward; fill the rest with zeros.", "description": "Move all 0's to the end of `nums` while keeping the order of the non-zero elements. Modify in place and return the list.\n\nExample:\n  move_zeroes([0,1,0,3,12]) -> [1,3,12,0,0]", "starter": "def move_zeroes(nums):\n    pass\n", "solution": "def move_zeroes(nums):\n    w = 0                          # next write slot\n    for n in nums:\n        if n != 0:\n            nums[w] = n\n            w += 1\n    for i in range(w, len(nums)):\n        nums[i] = 0\n    return nums\n", "explanation": "Two pointers: copy each non-zero to the front (write pointer w), then zero-fill the tail. Stable and in place. Time O(n), space O(1).", "tests": "check(\"ex1\", move_zeroes([0,1,0,3,12]), [1,3,12,0,0])\ncheck(\"nozeros\", move_zeroes([1,2,3]), [1,2,3])\ncheck(\"allzeros\", move_zeroes([0,0]), [0,0])\n"}, {"id": "remove-duplicates-sorted", "title": "Remove Duplicates from Sorted Array", "difficulty": "Easy", "category": "Two Pointers", "pattern": "Slow/fast pointers; write each new value once.", "description": "`nums` is sorted ascending. Remove duplicates in place so each value appears once, and return k = the number of unique elements. The first k slots of nums must hold the unique values in order.\n\nReturn k here (the harness checks both k and nums[:k]).\n\nExample:\n  remove_duplicates([1,1,2]) -> 2, nums[:2] == [1,2]", "starter": "def remove_duplicates(nums):\n    pass\n", "solution": "def remove_duplicates(nums):\n    if not nums:\n        return 0\n    w = 1                          # next write slot\n    for i in range(1, len(nums)):\n        if nums[i] != nums[w - 1]:\n            nums[w] = nums[i]\n            w += 1\n    return w\n", "explanation": "Sorted means duplicates are adjacent. Keep a write pointer; whenever the current value differs from the last written one, write it. Returns the unique count. Time O(n), space O(1).", "tests": "a = [1,1,2]\ncheck(\"k\", remove_duplicates(a), 2)\ncheck(\"front\", a[:2], [1,2])\nb = [0,0,1,1,1,2,2,3,3,4]\ncheck(\"k2\", remove_duplicates(b), 5)\ncheck(\"front2\", b[:5], [0,1,2,3,4])\n"}, {"id": "container-most-water", "title": "Container With Most Water", "difficulty": "Medium", "category": "Two Pointers", "pattern": "Move the shorter wall inward \u2014 it's the only way area can grow.", "description": "Each element of `height` is a vertical line. Pick two lines that with the x-axis form a container holding the most water; return that area (min height * width).\n\nExample:\n  max_area([1,8,6,2,5,4,8,3,7]) -> 49\n  max_area([1,1])               -> 1", "starter": "def max_area(height):\n    pass\n", "solution": "def max_area(height):\n    lo, hi = 0, len(height) - 1\n    best = 0\n    while lo < hi:\n        area = min(height[lo], height[hi]) * (hi - lo)\n        best = max(best, area)\n        if height[lo] < height[hi]:\n            lo += 1\n        else:\n            hi -= 1\n    return best\n", "explanation": "Start wide. Width only shrinks as pointers converge, so move the shorter line inward \u2014 keeping it could never beat the current area. Time O(n), space O(1).", "tests": "check(\"ex1\", max_area([1,8,6,2,5,4,8,3,7]), 49)\ncheck(\"ex2\", max_area([1,1]), 1)\ncheck(\"incr\", max_area([1,2,3,4,5]), 6)\n"}, {"id": "best-time-stock", "title": "Best Time to Buy and Sell Stock", "difficulty": "Easy", "category": "Sliding Window", "pattern": "Track the min price so far; best profit = price - min.", "description": "`prices[i]` is the price on day i. Buy on one day and sell on a later day. Return the max profit, or 0 if no profit is possible.\n\nExample:\n  max_profit([7,1,5,3,6,4]) -> 5   (buy at 1, sell at 6)\n  max_profit([7,6,4,3,1])   -> 0", "starter": "def max_profit(prices):\n    pass\n", "solution": "def max_profit(prices):\n    best = 0\n    cheapest = float('inf')\n    for p in prices:\n        cheapest = min(cheapest, p)\n        best = max(best, p - cheapest)\n    return best\n", "explanation": "One pass: keep the lowest price seen so far; the best sell-today profit is price - cheapest. Track the max. Time O(n), space O(1).", "tests": "check(\"ex1\", max_profit([7,1,5,3,6,4]), 5)\ncheck(\"none\", max_profit([7,6,4,3,1]), 0)\ncheck(\"empty\", max_profit([]), 0)\n"}, {"id": "max-subarray", "title": "Maximum Subarray", "difficulty": "Medium", "category": "Sliding Window", "pattern": "Kadane: drop the running sum the moment it goes negative.", "description": "Return the largest sum of any contiguous non-empty subarray of `nums`.\n\nExample:\n  max_sub_array([-2,1,-3,4,-1,2,1,-5,4]) -> 6   ([4,-1,2,1])\n  max_sub_array([-1])                    -> -1", "starter": "def max_sub_array(nums):\n    pass\n", "solution": "def max_sub_array(nums):\n    best = cur = nums[0]\n    for n in nums[1:]:\n        cur = max(n, cur + n)\n        best = max(best, cur)\n    return best\n", "explanation": "Kadane's algorithm. cur = best sum ending here: either extend the previous run or restart at n (whichever is larger). Track the global best. Time O(n), space O(1).", "tests": "check(\"ex1\", max_sub_array([-2,1,-3,4,-1,2,1,-5,4]), 6)\ncheck(\"neg\", max_sub_array([-1]), -1)\ncheck(\"allpos\", max_sub_array([1,2,3]), 6)\n"}, {"id": "longest-substring-no-repeat", "title": "Longest Substring Without Repeating Characters", "difficulty": "Medium", "category": "Sliding Window", "pattern": "Grow a window; on a repeat, jump the left edge past it.", "description": "Return the length of the longest substring of `s` with no repeating characters.\n\nExample:\n  length_of_longest(\"abcabcbb\") -> 3   (\"abc\")\n  length_of_longest(\"bbbbb\")    -> 1\n  length_of_longest(\"pwwkew\")   -> 3   (\"wke\")", "starter": "def length_of_longest(s):\n    pass\n", "solution": "def length_of_longest(s):\n    last = {}                      # char -> last index seen\n    start = 0\n    best = 0\n    for i, c in enumerate(s):\n        if c in last and last[c] >= start:\n            start = last[c] + 1\n        last[c] = i\n        best = max(best, i - start + 1)\n    return best\n", "explanation": "Sliding window [start, i]. Remember each char's last index; when you hit a repeat inside the window, move start just past that earlier occurrence. Window size i-start+1 tracks the answer. Time O(n).", "tests": "check(\"ex1\", length_of_longest(\"abcabcbb\"), 3)\ncheck(\"same\", length_of_longest(\"bbbbb\"), 1)\ncheck(\"ex3\", length_of_longest(\"pwwkew\"), 3)\ncheck(\"empty\", length_of_longest(\"\"), 0)\n"}, {"id": "valid-parentheses", "title": "Valid Parentheses", "difficulty": "Easy", "category": "Stack", "pattern": "Push openers; each closer must match the top of the stack.", "description": "Given a string of just the characters ()[]{}, return True if every bracket is closed by the same type in the correct order.\n\nExample:\n  is_valid(\"()[]{}\") -> True\n  is_valid(\"(]\")     -> False\n  is_valid(\"([)]\")   -> False", "starter": "def is_valid(s):\n    pass\n", "solution": "def is_valid(s):\n    pairs = {')': '(', ']': '[', '}': '{'}\n    stack = []\n    for c in s:\n        if c in pairs:\n            if not stack or stack.pop() != pairs[c]:\n                return False\n        else:\n            stack.append(c)\n    return not stack\n", "explanation": "Push every opener. On a closer, the top of the stack must be its matching opener (and the stack must be non-empty). Valid iff the stack is empty at the end. Time O(n).", "tests": "check(\"ok\", is_valid(\"()[]{}\"), True)\ncheck(\"mismatch\", is_valid(\"(]\"), False)\ncheck(\"order\", is_valid(\"([)]\"), False)\ncheck(\"nested\", is_valid(\"{[]}\"), True)\ncheck(\"openleft\", is_valid(\"(\"), False)\n"}, {"id": "daily-temperatures", "title": "Daily Temperatures", "difficulty": "Medium", "category": "Stack", "pattern": "Monotonic stack of indices waiting for a warmer day.", "description": "Given daily `temperatures`, return an array where answer[i] is how many days you wait for a warmer temperature, or 0 if none.\n\nExample:\n  daily_temperatures([73,74,75,71,69,72,76,73])\n    -> [1,1,4,2,1,1,0,0]", "starter": "def daily_temperatures(temperatures):\n    pass\n", "solution": "def daily_temperatures(temperatures):\n    ans = [0] * len(temperatures)\n    stack = []                     # indices of days awaiting warmth\n    for i, t in enumerate(temperatures):\n        while stack and temperatures[stack[-1]] < t:\n            j = stack.pop()\n            ans[j] = i - j\n        stack.append(i)\n    return ans\n", "explanation": "Keep a stack of indices with decreasing temps. Today resolves every stacked day it's warmer than; the wait is the index gap. Each index is pushed/popped once. Time O(n).", "tests": "check(\"ex1\", daily_temperatures([73,74,75,71,69,72,76,73]), [1,1,4,2,1,1,0,0])\ncheck(\"desc\", daily_temperatures([5,4,3,2,1]), [0,0,0,0,0])\ncheck(\"one\", daily_temperatures([30]), [0])\n"}, {"id": "binary-search", "title": "Binary Search", "difficulty": "Easy", "category": "Binary Search", "pattern": "Halve the range each step; mind lo<=hi and mid+/-1.", "description": "`nums` is sorted ascending and has unique values. Return the index of `target`, or -1 if it's not present.\n\nExample:\n  search([-1,0,3,5,9,12], 9) -> 4\n  search([-1,0,3,5,9,12], 2) -> -1", "starter": "def search(nums, target):\n    pass\n", "solution": "def search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n", "explanation": "Classic binary search. Use lo <= hi (inclusive) and always move past mid (mid+1 / mid-1) so the range strictly shrinks. Time O(log n).", "tests": "check(\"found\", search([-1,0,3,5,9,12], 9), 4)\ncheck(\"missing\", search([-1,0,3,5,9,12], 2), -1)\ncheck(\"first\", search([1,2,3], 1), 0)\ncheck(\"last\", search([1,2,3], 3), 2)\n"}, {"id": "search-insert", "title": "Search Insert Position", "difficulty": "Easy", "category": "Binary Search", "pattern": "When not found, lo lands on the insertion index.", "description": "`nums` is sorted with distinct values. Return the index of `target`; if absent, return the index where it would be inserted to keep the array sorted.\n\nExample:\n  search_insert([1,3,5,6], 5) -> 2\n  search_insert([1,3,5,6], 2) -> 1\n  search_insert([1,3,5,6], 7) -> 4", "starter": "def search_insert(nums, target):\n    pass\n", "solution": "def search_insert(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return lo\n", "explanation": "Same search, but on a miss the loop exits with lo pointing at the first slot >= target \u2014 exactly the insertion index. Time O(log n).", "tests": "check(\"found\", search_insert([1,3,5,6], 5), 2)\ncheck(\"mid\", search_insert([1,3,5,6], 2), 1)\ncheck(\"end\", search_insert([1,3,5,6], 7), 4)\ncheck(\"front\", search_insert([1,3,5,6], 0), 0)\n"}, {"id": "search-rotated", "title": "Search in Rotated Sorted Array", "difficulty": "Medium", "category": "Binary Search", "pattern": "One half is always sorted; decide which, then which side to keep.", "description": "A sorted, distinct array was rotated at an unknown pivot (e.g. [0,1,2,4,5,6,7] -> [4,5,6,7,0,1,2]). Return the index of `target` or -1.\n\nExample:\n  search_rotated([4,5,6,7,0,1,2], 0) -> 4\n  search_rotated([4,5,6,7,0,1,2], 3) -> -1", "starter": "def search_rotated(nums, target):\n    pass\n", "solution": "def search_rotated(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:           # left half sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                               # right half sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n", "explanation": "At each step one half is properly sorted. Detect which (compare nums[lo] and nums[mid]); if the target falls inside that sorted range, search it, else search the other half. Time O(log n).", "tests": "check(\"found\", search_rotated([4,5,6,7,0,1,2], 0), 4)\ncheck(\"missing\", search_rotated([4,5,6,7,0,1,2], 3), -1)\ncheck(\"pivot\", search_rotated([4,5,6,7,0,1,2], 4), 0)\ncheck(\"one\", search_rotated([1], 1), 0)\n"}, {"id": "reverse-string", "title": "Reverse String", "difficulty": "Easy", "category": "Strings", "pattern": "Two pointers swapping inward \u2014 in place.", "description": "Reverse a list of characters `s` in place and return it.\n\nExample:\n  reverse_string([\"h\",\"e\",\"l\",\"l\",\"o\"]) -> [\"o\",\"l\",\"l\",\"e\",\"h\"]", "starter": "def reverse_string(s):\n    pass\n", "solution": "def reverse_string(s):\n    lo, hi = 0, len(s) - 1\n    while lo < hi:\n        s[lo], s[hi] = s[hi], s[lo]\n        lo += 1\n        hi -= 1\n    return s\n", "explanation": "Swap the outermost pair, then move both pointers inward until they meet. In place, O(1) extra space, O(n) time.", "tests": "check(\"ex1\", reverse_string([\"h\",\"e\",\"l\",\"l\",\"o\"]), [\"o\",\"l\",\"l\",\"e\",\"h\"])\ncheck(\"even\", reverse_string([\"a\",\"b\"]), [\"b\",\"a\"])\ncheck(\"one\", reverse_string([\"x\"]), [\"x\"])\n"}, {"id": "longest-common-prefix", "title": "Longest Common Prefix", "difficulty": "Easy", "category": "Strings", "pattern": "Shrink a candidate prefix against each string.", "description": "Return the longest common prefix among an array of strings, or the empty string \"\" if there is none.\n\nExample:\n  longest_common_prefix([\"flower\",\"flow\",\"flight\"]) -> \"fl\"\n  longest_common_prefix([\"dog\",\"racecar\",\"car\"])    -> \"\"", "starter": "def longest_common_prefix(strs):\n    pass\n", "solution": "def longest_common_prefix(strs):\n    if not strs:\n        return \"\"\n    prefix = strs[0]\n    for s in strs[1:]:\n        while not s.startswith(prefix):\n            prefix = prefix[:-1]\n            if not prefix:\n                return \"\"\n    return prefix\n", "explanation": "Start with the first string as the candidate prefix; for each other string, trim the candidate from the right until it's a prefix. Time O(total chars).", "tests": "check(\"ex1\", longest_common_prefix([\"flower\",\"flow\",\"flight\"]), \"fl\")\ncheck(\"none\", longest_common_prefix([\"dog\",\"racecar\",\"car\"]), \"\")\ncheck(\"one\", longest_common_prefix([\"single\"]), \"single\")\n"}, {"id": "roman-to-int", "title": "Roman to Integer", "difficulty": "Easy", "category": "Strings", "pattern": "Subtract when a smaller numeral precedes a larger one.", "description": "Convert a Roman numeral string to an integer. Symbols: I=1 V=5 X=10 L=50 C=100 D=500 M=1000. A smaller value before a larger one is subtracted (IV=4, IX=9, XL=40 ...).\n\nExample:\n  roman_to_int(\"III\")     -> 3\n  roman_to_int(\"LVIII\")   -> 58\n  roman_to_int(\"MCMXCIV\") -> 1994", "starter": "def roman_to_int(s):\n    pass\n", "solution": "def roman_to_int(s):\n    val = {'I':1,'V':5,'X':10,'L':50,'C':100,'D':500,'M':1000}\n    total = 0\n    for i, c in enumerate(s):\n        if i + 1 < len(s) and val[c] < val[s[i + 1]]:\n            total -= val[c]\n        else:\n            total += val[c]\n    return total\n", "explanation": "Sum each numeral, but if a numeral is smaller than the one to its right, subtract it instead (that encodes the IV/IX form). Time O(n).", "tests": "check(\"three\", roman_to_int(\"III\"), 3)\ncheck(\"58\", roman_to_int(\"LVIII\"), 58)\ncheck(\"1994\", roman_to_int(\"MCMXCIV\"), 1994)\ncheck(\"four\", roman_to_int(\"IV\"), 4)\n"}, {"id": "reverse-words", "title": "Reverse Words in a String", "difficulty": "Medium", "category": "Strings", "pattern": "split() drops extra spaces; reverse; re-join with one space.", "description": "Reverse the order of words in `s`. A word is a maximal run of non-space chars. Collapse multiple spaces and trim leading/trailing space; words in the result are separated by a single space.\n\nExample:\n  reverse_words(\"the sky is blue\")     -> \"blue is sky the\"\n  reverse_words(\"  hello   world  \")   -> \"world hello\"", "starter": "def reverse_words(s):\n    pass\n", "solution": "def reverse_words(s):\n    return \" \".join(s.split()[::-1])\n", "explanation": "s.split() with no args splits on any whitespace and drops empties, so trimming/collapsing is free. Reverse the word list and join with one space. Time O(n).", "tests": "check(\"ex1\", reverse_words(\"the sky is blue\"), \"blue is sky the\")\ncheck(\"spaces\", reverse_words(\"  hello   world  \"), \"world hello\")\ncheck(\"one\", reverse_words(\"word\"), \"word\")\n"}, {"id": "is-subsequence", "title": "Is Subsequence", "difficulty": "Easy", "category": "Strings", "pattern": "Advance one pointer through t, ticking off chars of s in order.", "description": "Return True if `s` is a subsequence of `t` (the chars of s appear in t in order, not necessarily contiguously).\n\nExample:\n  is_subsequence(\"abc\", \"ahbgdc\") -> True\n  is_subsequence(\"axc\", \"ahbgdc\") -> False", "starter": "def is_subsequence(s, t):\n    pass\n", "solution": "def is_subsequence(s, t):\n    i = 0\n    for c in t:\n        if i < len(s) and s[i] == c:\n            i += 1\n    return i == len(s)\n", "explanation": "Walk through t once; each time the current char matches s[i], advance i. If i reaches the end of s, every char was matched in order. Time O(len(t)).", "tests": "check(\"yes\", is_subsequence(\"abc\", \"ahbgdc\"), True)\ncheck(\"no\", is_subsequence(\"axc\", \"ahbgdc\"), False)\ncheck(\"empty\", is_subsequence(\"\", \"anything\"), True)\n"}, {"id": "fizzbuzz", "title": "Fizz Buzz", "difficulty": "Easy", "category": "Math", "pattern": "Divisibility with %, build strings; check 15 first or concat.", "description": "Return a list of length `n` (1-indexed) where multiples of 3 are \"Fizz\", of 5 are \"Buzz\", of both are \"FizzBuzz\", else the number as a string.\n\nExample:\n  fizz_buzz(5) -> [\"1\",\"2\",\"Fizz\",\"4\",\"Buzz\"]", "starter": "def fizz_buzz(n):\n    pass\n", "solution": "def fizz_buzz(n):\n    out = []\n    for i in range(1, n + 1):\n        s = \"\"\n        if i % 3 == 0:\n            s += \"Fizz\"\n        if i % 5 == 0:\n            s += \"Buzz\"\n        out.append(s or str(i))\n    return out\n", "explanation": "Build the label by concatenation: \"Fizz\" for /3, \"Buzz\" for /5 (both gives \"FizzBuzz\" automatically). If the label is empty, fall back to the number. `s or str(i)` picks the number when s is falsy. Time O(n).", "tests": "check(\"ex5\", fizz_buzz(5), [\"1\",\"2\",\"Fizz\",\"4\",\"Buzz\"])\ncheck(\"fb\", fizz_buzz(15)[14], \"FizzBuzz\")\ncheck(\"one\", fizz_buzz(1), [\"1\"])\n"}, {"id": "palindrome-number", "title": "Palindrome Number", "difficulty": "Easy", "category": "Math", "pattern": "Negatives never qualify; reverse via %10 and //10 (no str).", "description": "Return True if integer `x` reads the same forwards and backwards. Negative numbers are never palindromes.\n\nExample:\n  is_palindrome_num(121)  -> True\n  is_palindrome_num(-121) -> False\n  is_palindrome_num(10)   -> False", "starter": "def is_palindrome_num(x):\n    pass\n", "solution": "def is_palindrome_num(x):\n    if x < 0:\n        return False\n    rev, n = 0, x\n    while n > 0:\n        rev = rev * 10 + n % 10\n        n //= 10\n    return rev == x\n", "explanation": "Build the reversed number digit by digit (n % 10 grabs the last digit, n //= 10 drops it) and compare. Negatives short-circuit to False. Time O(digits).", "tests": "check(\"yes\", is_palindrome_num(121), True)\ncheck(\"neg\", is_palindrome_num(-121), False)\ncheck(\"ten\", is_palindrome_num(10), False)\ncheck(\"zero\", is_palindrome_num(0), True)\n"}, {"id": "plus-one", "title": "Plus One", "difficulty": "Easy", "category": "Math", "pattern": "Carry from the right; a leading carry prepends a 1.", "description": "`digits` is a non-negative integer, one digit per element, most significant first. Add one and return the resulting digits.\n\nExample:\n  plus_one([1,2,3]) -> [1,2,4]\n  plus_one([9,9])   -> [1,0,0]", "starter": "def plus_one(digits):\n    pass\n", "solution": "def plus_one(digits):\n    for i in range(len(digits) - 1, -1, -1):\n        if digits[i] < 9:\n            digits[i] += 1\n            return digits\n        digits[i] = 0\n    return [1] + digits\n", "explanation": "Walk from the least significant digit. A digit < 9 just increments and you're done; a 9 becomes 0 and carries. If every digit was 9 the loop ends and you prepend a 1. Time O(n).", "tests": "check(\"simple\", plus_one([1,2,3]), [1,2,4])\ncheck(\"carry\", plus_one([9,9]), [1,0,0])\ncheck(\"mid\", plus_one([1,9,9]), [2,0,0])\n"}, {"id": "single-number", "title": "Single Number", "difficulty": "Easy", "category": "Math", "pattern": "XOR cancels pairs; the loner survives.", "description": "Every element of `nums` appears twice except one. Return the one that appears once. Aim for O(n) time and O(1) space.\n\nExample:\n  single_number([2,2,1])     -> 1\n  single_number([4,1,2,1,2]) -> 4", "starter": "def single_number(nums):\n    pass\n", "solution": "def single_number(nums):\n    result = 0\n    for n in nums:\n        result ^= n\n    return result\n", "explanation": "XOR of a number with itself is 0 and XOR with 0 is the number, so XOR-ing everything cancels all the pairs and leaves the unique value. Time O(n), space O(1).", "tests": "check(\"ex1\", single_number([2,2,1]), 1)\ncheck(\"ex2\", single_number([4,1,2,1,2]), 4)\ncheck(\"one\", single_number([7]), 7)\n"}, {"id": "majority-element", "title": "Majority Element", "difficulty": "Easy", "category": "Math", "pattern": "Boyer-Moore voting: a count that the majority can't lose.", "description": "An element appears more than n/2 times in `nums`. Return it. Aim for O(n) time, O(1) space.\n\nExample:\n  majority_element([3,2,3])         -> 3\n  majority_element([2,2,1,1,1,2,2]) -> 2", "starter": "def majority_element(nums):\n    pass\n", "solution": "def majority_element(nums):\n    count = 0\n    candidate = None\n    for n in nums:\n        if count == 0:\n            candidate = n\n        count += 1 if n == candidate else -1\n    return candidate\n", "explanation": "Boyer-Moore voting: pair off each occurrence of the candidate against a different value. The true majority (> n/2) can never be fully cancelled, so it's whatever the candidate is at the end. Time O(n), space O(1).", "tests": "check(\"ex1\", majority_element([3,2,3]), 3)\ncheck(\"ex2\", majority_element([2,2,1,1,1,2,2]), 2)\ncheck(\"one\", majority_element([1]), 1)\n"}, {"id": "merge-intervals", "title": "Merge Intervals", "difficulty": "Medium", "category": "Intervals", "pattern": "Sort by start; merge when the next start <= current end.", "description": "Given a list of [start, end] intervals, merge all overlapping ones and return the result sorted by start.\n\nExample:\n  merge([[1,3],[2,6],[8,10],[15,18]]) -> [[1,6],[8,10],[15,18]]\n  merge([[1,4],[4,5]])                -> [[1,5]]", "starter": "def merge(intervals):\n    pass\n", "solution": "def merge(intervals):\n    intervals.sort(key=lambda iv: iv[0])\n    out = []\n    for iv in intervals:\n        if out and iv[0] <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], iv[1])\n        else:\n            out.append(iv[:])\n    return out\n", "explanation": "Sort by start so overlaps are adjacent. Walk through; if the current interval starts before the last merged one ends, extend that one's end, otherwise start a fresh interval. Time O(n log n).", "tests": "check(\"ex1\", merge([[1,3],[2,6],[8,10],[15,18]]), [[1,6],[8,10],[15,18]])\ncheck(\"touch\", merge([[1,4],[4,5]]), [[1,5]])\ncheck(\"one\", merge([[1,4]]), [[1,4]])\ncheck(\"unsorted\", merge([[2,3],[1,2]]), [[1,3]])\n"}, {"id": "min-stack", "title": "Min Stack", "difficulty": "Medium", "category": "Design", "pattern": "Carry the running min alongside each pushed value.", "description": "Design a stack supporting push, pop, top and get_min \u2014 all O(1).\n\n  MinStack()        # empty\n  push(val)         # push val\n  pop()             # remove top\n  top()             # return top value\n  get_min()         # return the minimum value in the stack\n\nExample:\n  s = MinStack(); s.push(-2); s.push(0); s.push(-3)\n  s.get_min() -> -3;  s.pop();  s.top() -> 0;  s.get_min() -> -2", "starter": "class MinStack:\n    def __init__(self):\n        pass\n\n    def push(self, val):\n        pass\n\n    def pop(self):\n        pass\n\n    def top(self):\n        pass\n\n    def get_min(self):\n        pass\n", "solution": "class MinStack:\n    def __init__(self):\n        self.stack = []            # (value, min-so-far)\n\n    def push(self, val):\n        cur_min = val if not self.stack else min(val, self.stack[-1][1])\n        self.stack.append((val, cur_min))\n\n    def pop(self):\n        self.stack.pop()\n\n    def top(self):\n        return self.stack[-1][0]\n\n    def get_min(self):\n        return self.stack[-1][1]\n", "explanation": "Store each element as a (value, min-of-stack-up-to-here) pair. The min is then always the top pair's second field, so get_min is O(1) and survives pops automatically.", "tests": "s = MinStack()\ns.push(-2); s.push(0); s.push(-3)\ncheck(\"min1\", s.get_min(), -3)\ns.pop()\ncheck(\"top\", s.top(), 0)\ncheck(\"min2\", s.get_min(), -2)\n"}, {"id": "word-bank", "title": "WordBank (frequency tracker)", "difficulty": "Easy", "category": "IMC: Stateful Class", "pattern": "The counter idiom: d[k] = d.get(k, 0) + 1.", "description": "A by-hand frequency tracker (no collections.Counter).\n\n  __init__()       # empty state\n  add(word)        # +1 to word's count (from 0 if new); return new count\n  count(word)      # current count (0 if never seen)\n  unique()         # number of distinct words seen", "starter": "class WordBank:\n    def __init__(self):\n        pass\n\n    def add(self, word):\n        pass\n\n    def count(self, word):\n        pass\n\n    def unique(self):\n        pass\n", "solution": "class WordBank:\n    def __init__(self):\n        self.counts = {}\n\n    def add(self, word):\n        self.counts[word] = self.counts.get(word, 0) + 1\n        return self.counts[word]\n\n    def count(self, word):\n        return self.counts.get(word, 0)\n\n    def unique(self):\n        return len(self.counts)\n", "explanation": "State is one dict word->count. The counter idiom .get(k, 0) + 1 handles the first-seen case without a branch; count() reuses .get with a 0 default so a missing word never raises.", "tests": "b = WordBank()\ncheck(\"a1\", b.add(\"a\"), 1)\ncheck(\"a2\", b.add(\"a\"), 2)\ncheck(\"b1\", b.add(\"b\"), 1)\ncheck(\"count_a\", b.count(\"a\"), 2)\ncheck(\"count_missing\", b.count(\"zzz\"), 0)\ncheck(\"unique\", b.unique(), 2)\n"}, {"id": "leaderboard", "title": "Leaderboard (top-N with tie-break)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "sorted(d.items(), key=lambda kv: (-kv[1], kv[0]))[:n].", "description": "The most common hard-ish IMC shape: accumulate then rank.\n\n  __init__()             # empty state\n  add_score(name, pts)   # add pts to name's total (from 0 if new)\n  top(n)                 # top n as (name, total) tuples, sorted by\n                         # total DESC, then name ASC on ties", "starter": "class Leaderboard:\n    def __init__(self):\n        pass\n\n    def add_score(self, name, points):\n        pass\n\n    def top(self, n):\n        pass\n", "solution": "class Leaderboard:\n    def __init__(self):\n        self.scores = {}\n\n    def add_score(self, name, points):\n        self.scores[name] = self.scores.get(name, 0) + points\n\n    def top(self, n):\n        return sorted(self.scores.items(),\n                      key=lambda kv: (-kv[1], kv[0]))[:n]\n", "explanation": "Counter idiom to accumulate totals. The tie-break is the tuple key (-count, name): negating the count sorts it descending while name stays ascending. Slice [:n] safely handles n > number of players. Sort .items() (pairs), not the dict (keys).", "tests": "L = Leaderboard()\nL.add_score(\"alice\", 50)\nL.add_score(\"bob\", 50)\nL.add_score(\"carol\", 30)\nL.add_score(\"alice\", 20)\ncheck(\"top2\", L.top(2), [(\"alice\", 70), (\"bob\", 50)])\ncheck(\"topall\", L.top(5), [(\"alice\", 70), (\"bob\", 50), (\"carol\", 30)])\n"}, {"id": "ttl-store", "title": "TTLStore (expiry by timestamp)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "Store (value, expires_at); alive while timestamp < expires_at.", "description": "A key/value store whose entries expire. Time is passed in as an int (no real clock).\n\n  __init__()\n  set(key, value, timestamp, ttl)  # expires at timestamp + ttl\n  get(key, timestamp)              # value if it exists AND\n                                   # timestamp < expires_at, else None", "starter": "class TTLStore:\n    def __init__(self):\n        pass\n\n    def set(self, key, value, timestamp, ttl):\n        pass\n\n    def get(self, key, timestamp):\n        pass\n", "solution": "class TTLStore:\n    def __init__(self):\n        self.store = {}            # key -> (value, expires_at)\n\n    def set(self, key, value, timestamp, ttl):\n        self.store[key] = (value, timestamp + ttl)\n\n    def get(self, key, timestamp):\n        if key not in self.store:\n            return None\n        value, expires_at = self.store[key]\n        if timestamp < expires_at:\n            return value\n        return None\n", "explanation": "Store the precomputed expiry (timestamp + ttl) next to the value. On get, guard membership FIRST (so a missing key returns None instead of raising), then compare with strict < \u2014 exactly at expiry counts as expired.", "tests": "s = TTLStore()\ns.set(\"a\", \"x\", 100, 50)\ncheck(\"alive\", s.get(\"a\", 120), \"x\")\ncheck(\"boundary\", s.get(\"a\", 150), None)\ncheck(\"expired\", s.get(\"a\", 200), None)\ncheck(\"missing\", s.get(\"missing\", 100), None)\n"}, {"id": "task-queue", "title": "TaskQueue (state machine + ordering)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "Two dicts; guard unknown ids; filter-then-sort with a tuple key.", "description": "Track each task's status and priority.\n\n  __init__()\n  submit(task_id, priority)  # register \"pending\" with a priority (int)\n  start(task_id)             # -> \"running\"; return False if unknown\n  complete(task_id)          # -> \"done\"; return False if unknown\n  status(task_id)            # status string, or None if unknown\n  pending()                  # ids still \"pending\", sorted by\n                             # priority DESC, then task_id ASC", "starter": "class TaskQueue:\n    def __init__(self):\n        pass\n\n    def submit(self, task_id, priority):\n        pass\n\n    def start(self, task_id):\n        pass\n\n    def complete(self, task_id):\n        pass\n\n    def status(self, task_id):\n        pass\n\n    def pending(self):\n        pass\n", "solution": "class TaskQueue:\n    def __init__(self):\n        self.status_of = {}        # task_id -> status string\n        self.priority = {}         # task_id -> int\n\n    def submit(self, task_id, priority):\n        self.status_of[task_id] = \"pending\"\n        self.priority[task_id] = priority\n\n    def start(self, task_id):\n        if task_id not in self.status_of:\n            return False\n        self.status_of[task_id] = \"running\"\n\n    def complete(self, task_id):\n        if task_id not in self.status_of:\n            return False\n        self.status_of[task_id] = \"done\"\n\n    def status(self, task_id):\n        return self.status_of.get(task_id)\n\n    def pending(self):\n        ids = [t for t in self.status_of if self.status_of[t] == \"pending\"]\n        return sorted(ids, key=lambda t: (-self.priority[t], t))\n", "explanation": "Two parallel dicts (status + priority). State transitions guard the id with `not in` and return False on unknown. pending() filters to just \"pending\" ids then sorts with the (-priority, id) tuple key.", "tests": "q = TaskQueue()\nq.submit(\"t1\", 5)\nq.submit(\"t2\", 5)\nq.submit(\"t3\", 9)\nq.start(\"t1\")\ncheck(\"running\", q.status(\"t1\"), \"running\")\ncheck(\"unknown_status\", q.status(\"nope\"), None)\ncheck(\"unknown_start\", q.start(\"nope\"), False)\ncheck(\"pending1\", q.pending(), [\"t3\", \"t2\"])\nq.complete(\"t2\")\ncheck(\"pending2\", q.pending(), [\"t3\"])\n"}, {"id": "order-book", "title": "OrderBook (count AND group at once)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "Counter idiom + grouping idiom side by side (NOT comprehensions).", "description": "Track per-symbol share totals and per-trader fills.\n\n  __init__()\n  fill(trader, symbol, shares)  # add shares to symbol's total AND\n                                # append (symbol, shares) to trader\n  volume(symbol)                # total shares for symbol (0 if none)\n  fills_for(trader)             # list of (symbol, shares), [] if none\n  top_symbols(n)                # top n (symbol, vol), vol DESC then\n                                # symbol ASC on ties", "starter": "class OrderBook:\n    def __init__(self):\n        pass\n\n    def fill(self, trader, symbol, shares):\n        pass\n\n    def volume(self, symbol):\n        pass\n\n    def fills_for(self, trader):\n        pass\n\n    def top_symbols(self, n):\n        pass\n", "solution": "class OrderBook:\n    def __init__(self):\n        self.vol = {}              # symbol -> total shares (COUNTER)\n        self.by_trader = {}        # trader -> [(symbol, shares)] (GROUP)\n\n    def fill(self, trader, symbol, shares):\n        self.vol[symbol] = self.vol.get(symbol, 0) + shares\n        self.by_trader.setdefault(trader, []).append((symbol, shares))\n\n    def volume(self, symbol):\n        return self.vol.get(symbol, 0)\n\n    def fills_for(self, trader):\n        return self.by_trader.get(trader, [])\n\n    def top_symbols(self, n):\n        return sorted(self.vol.items(),\n                      key=lambda kv: (-kv[1], kv[0]))[:n]\n", "explanation": "Two accumulation idioms together: .get(k, 0) + shares to COUNT volume, setdefault(k, []).append(...) to GROUP fills. Both need a statement that mutates a dict \u2014 a comprehension can't accumulate into buckets. Then the usual (-vol, symbol) top-N sort.", "tests": "ob = OrderBook()\nob.fill(\"alice\", \"AAPL\", 100)\nob.fill(\"bob\", \"AAPL\", 50)\nob.fill(\"alice\", \"MSFT\", 150)\nob.fill(\"carol\", \"TSLA\", 90)\ncheck(\"vol\", ob.volume(\"AAPL\"), 150)\ncheck(\"vol_missing\", ob.volume(\"ZZZZ\"), 0)\ncheck(\"fills\", ob.fills_for(\"alice\"), [(\"AAPL\", 100), (\"MSFT\", 150)])\ncheck(\"fills_missing\", ob.fills_for(\"nobody\"), [])\ncheck(\"top\", ob.top_symbols(2), [(\"AAPL\", 150), (\"MSFT\", 150)])\n"}, {"id": "tournament", "title": "Tournament (filter -> sort -> slice)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "Nested records; guard unknown names; the 3-stage standings pipeline.", "description": "Players each have a score and an active flag.\n\n  __init__()\n  join(name)         # record {score: 0, active: True}\n  award(name, pts)   # add pts to score (ignore unknown names)\n  eliminate(name)    # set active False (ignore unknown)\n  standings(n)       # top n ACTIVE players as (name, score),\n                     # score DESC then name ASC; eliminated excluded", "starter": "class Tournament:\n    def __init__(self):\n        pass\n\n    def join(self, name):\n        pass\n\n    def award(self, name, pts):\n        pass\n\n    def eliminate(self, name):\n        pass\n\n    def standings(self, n):\n        pass\n", "solution": "class Tournament:\n    def __init__(self):\n        self.players = {}          # name -> {score, active}\n\n    def join(self, name):\n        self.players[name] = {\"score\": 0, \"active\": True}\n\n    def award(self, name, pts):\n        if name not in self.players:\n            return\n        self.players[name][\"score\"] += pts\n\n    def eliminate(self, name):\n        if name not in self.players:\n            return\n        self.players[name][\"active\"] = False\n\n    def standings(self, n):\n        active = [name for name in self.players if self.players[name][\"active\"]]\n        active.sort(key=lambda name: (-self.players[name][\"score\"], name))\n        return [(name, self.players[name][\"score\"]) for name in active][:n]\n", "explanation": "Each player is a nested record dict. Mutating methods guard unknown names up front. standings is the canonical three stages: FILTER to active, SORT by (-score, name), then map to (name, score) and SLICE [:n]. The final comprehension is the RIGHT use of one \u2014 pure transform, no accumulation.", "tests": "t = Tournament()\nt.join(\"a\"); t.join(\"b\"); t.join(\"c\")\nt.award(\"a\", 30); t.award(\"b\", 30); t.award(\"c\", 50)\nt.eliminate(\"c\")\nt.award(\"zzz\", 99)\ncheck(\"standings\", t.standings(5), [(\"a\", 30), (\"b\", 30)])\n"}, {"id": "versioned-config", "title": "VersionedConfig (snapshot / restore)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "deepcopy on BOTH snapshot and restore so nested state can't leak.", "description": "A settings store with backup/restore. The deepcopy trap lives here.\n\n  __init__()\n  set(key, value)   # value may be a list/dict\n  get(key)          # value, or None\n  snapshot()        # save a backup of the ENTIRE current config\n  restore()         # replace config with the last snapshot, such that\n                    # future edits don't corrupt the saved snapshot", "starter": "class VersionedConfig:\n    def __init__(self):\n        pass\n\n    def set(self, key, value):\n        pass\n\n    def get(self, key):\n        pass\n\n    def snapshot(self):\n        pass\n\n    def restore(self):\n        pass\n", "solution": "import copy\n\nclass VersionedConfig:\n    def __init__(self):\n        self.config = {}\n        self.backup = {}\n\n    def set(self, key, value):\n        self.config[key] = value\n\n    def get(self, key):\n        return self.config.get(key)\n\n    def snapshot(self):\n        self.backup = copy.deepcopy(self.config)\n\n    def restore(self):\n        self.config = copy.deepcopy(self.backup)\n", "explanation": "deepcopy on BOTH sides. Snapshot deepcopy freezes the backup so later live mutations (appending to a stored list) don't leak in. Restore deepcopy means future edits to config don't reach back and corrupt the saved backup \u2014 a shallow copy would share the nested objects.", "tests": "c = VersionedConfig()\nc.set(\"tags\", [\"a\", \"b\"])\nc.snapshot()\nc.get(\"tags\").append(\"c\")\nc.set(\"extra\", 1)\nc.restore()\ncheck(\"frozen\", c.get(\"tags\"), [\"a\", \"b\"])\ncheck(\"gone\", c.get(\"extra\"), None)\n"}, {"id": "access-log", "title": "AccessLog (and short-circuit order)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "Guard on the LEFT, risky deref on the RIGHT \u2014 and is L->R.", "description": "Records may or may not have a role key.\n\n  __init__()           # self.users = {} (user_id -> record dict)\n  add(user_id)         # create {\"active\": True}  (NO role key yet)\n  set_role(uid, role)  # set the record's role\n  admins()             # user_ids that are BOTH active AND role=='admin';\n                       # must NOT crash on users with no role. Any order.", "starter": "class AccessLog:\n    def __init__(self):\n        pass\n\n    def add(self, user_id):\n        pass\n\n    def set_role(self, user_id, role):\n        pass\n\n    def admins(self):\n        pass\n", "solution": "class AccessLog:\n    def __init__(self):\n        self.users = {}\n\n    def add(self, user_id):\n        self.users[user_id] = {\"active\": True}\n\n    def set_role(self, user_id, role):\n        self.users[user_id][\"role\"] = role\n\n    def admins(self):\n        out = []\n        for uid in self.users:\n            rec = self.users[uid]\n            if rec[\"active\"] and rec.get(\"role\") == \"admin\":\n                out.append(uid)\n        return out\n", "explanation": "`and` evaluates left to right and short-circuits, but only AFTER the left side ran \u2014 so the safe check must be on the left. rec.get('role') returns None on a roleless record (None == 'admin' is just False), never KeyError. rec['role'] would crash, so you'd need \"role\" in rec on the left first.", "tests": "a = AccessLog()\na.add(\"u1\"); a.add(\"u2\"); a.add(\"u3\")\na.set_role(\"u1\", \"admin\")\na.set_role(\"u3\", \"user\")\ncheck(\"admins\", sorted(a.admins()), [\"u1\"])\n"}, {"id": "rate-limiter", "title": "RateLimiter (sliding window)", "difficulty": "Medium", "category": "IMC: Stateful Class", "pattern": "Per-key timestamp list; drop entries outside the window, then count.", "description": "Allow at most `limit` requests per user within any window of `window` time units. Time is passed in as a non-decreasing int.\n\n  __init__(limit, window)\n  allow(user, timestamp)   # record + return True if the request is\n                           # allowed, else return False (not recorded).\n                           # A request at t counts requests with\n                           # time > t - window (i.e. last `window` units).\n\nExample with limit=2, window=10:\n  allow(\"u\", 1) -> True;  allow(\"u\", 2) -> True;  allow(\"u\", 3) -> False\n  allow(\"u\", 12) -> True   (the t=1,2 requests fell out of the window)", "starter": "class RateLimiter:\n    def __init__(self, limit, window):\n        pass\n\n    def allow(self, user, timestamp):\n        pass\n", "solution": "class RateLimiter:\n    def __init__(self, limit, window):\n        self.limit = limit\n        self.window = window\n        self.hits = {}             # user -> [timestamps]\n\n    def allow(self, user, timestamp):\n        recent = self.hits.setdefault(user, [])\n        cutoff = timestamp - self.window\n        recent[:] = [t for t in recent if t > cutoff]\n        if len(recent) >= self.limit:\n            return False\n        recent.append(timestamp)\n        return True\n", "explanation": "Keep each user's recent request times. On a request, drop timestamps older than the window (t > timestamp - window keeps the live ones), then allow only if fewer than `limit` remain \u2014 and record it. recent[:] = [...] rewrites the list in place so the dict keeps the same list object.", "tests": "r = RateLimiter(2, 10)\ncheck(\"a1\", r.allow(\"u\", 1), True)\ncheck(\"a2\", r.allow(\"u\", 2), True)\ncheck(\"a3\", r.allow(\"u\", 3), False)\ncheck(\"a4\", r.allow(\"u\", 12), True)\ncheck(\"other_user\", r.allow(\"v\", 12), True)\n"}]};

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const LS_KEY = "csprep_ide_v1";
const state = {
  mode: "problems",          // "problems" | "drills"
  probId: DATA.problems[0] ? DATA.problems[0].id : null,
  drillId: DATA.drills[0] ? DATA.drills[0].id : null,
  level: "1",                // active level tab (problems mode)
  selCase: null,             // expanded test-case func name
  lastResults: [],           // most recent run's results
  // persisted: { code: {itemKey: src}, solved: {itemKey: true|levelMap}, timer: secs }
  prog: { code: {}, solvedLevels: {}, solvedDrills: {} },
  // timer
  elapsed: 0, running: false, _tick: null,
};

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      state.prog = Object.assign(state.prog, p.prog || {});
      if (!state.prog.code) state.prog.code = {};
      if (!state.prog.solvedLevels) state.prog.solvedLevels = {};
      if (!state.prog.solvedDrills) state.prog.solvedDrills = {};
    }
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ prog: state.prog })); } catch (e) {}
}

function curProblem() { return DATA.problems.find(p => p.id === state.probId); }
function curDrill() { return DATA.drills.find(d => d.id === state.drillId); }
function isProblems() { return state.mode === "problems"; }

// a stable key for code storage: problems share one editor across levels,
// drills are per-id.
function codeKey() {
  return isProblems() ? "p:" + state.probId : "d:" + state.drillId;
}
function savedCode() { return state.prog.code[codeKey()]; }
function setSavedCode(src) { state.prog.code[codeKey()] = src; save(); }

/* ============================================================
   TINY MARKDOWN (statement rendering) — headings, lists, code,
   blockquotes, inline `code`. Good enough for our prompt.md files.
   ============================================================ */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inlineMd(s) {
  // escape first, then re-introduce inline code spans
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}
function renderMarkdown(md) {
  const lines = md.split("\n");
  let html = "", i = 0;
  let inList = false, inCode = false, inQuote = false;
  const closeList = () => { if (inList) { html += "</ul>"; inList = false; } };
  const closeQuote = () => { if (inQuote) { html += "</blockquote>"; inQuote = false; } };
  while (i < lines.length) {
    let line = lines[i];
    if (line.trim().startsWith("```")) {
      if (!inCode) { closeList(); closeQuote(); html += "<pre><code>"; inCode = true; }
      else { html += "</code></pre>"; inCode = false; }
      i++; continue;
    }
    if (inCode) { html += esc(line) + "\n"; i++; continue; }
    if (/^#{1,6}\s/.test(line)) {
      closeList(); closeQuote();
      const level = line.match(/^#+/)[0].length;
      const text = line.replace(/^#+\s/, "");
      const tag = level <= 1 ? "h1" : "h2";
      html += "<" + tag + ">" + inlineMd(text) + "</" + tag + ">";
      i++; continue;
    }
    if (/^\s*[-*]\s/.test(line)) {
      closeQuote();
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineMd(line.replace(/^\s*[-*]\s/, "")) + "</li>";
      i++; continue;
    }
    if (/^\s*>\s?/.test(line)) {
      closeList();
      if (!inQuote) { html += "<blockquote>"; inQuote = true; }
      html += inlineMd(line.replace(/^\s*>\s?/, "")) + " ";
      i++; continue;
    }
    if (line.trim() === "---") { closeList(); closeQuote(); i++; continue; }
    if (line.trim() === "") { closeList(); closeQuote(); i++; continue; }
    closeList(); closeQuote();
    html += "<p>" + inlineMd(line) + "</p>";
    i++;
  }
  closeList(); closeQuote();
  if (inCode) html += "</code></pre>";
  return html;
}

/* ============================================================
   CODEMIRROR (with graceful textarea fallback)
   ============================================================ */
let cm = null;
function initEditor() {
  if (typeof CodeMirror !== "undefined") {
    cm = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: "python", theme: "material-darker", lineNumbers: true,
      indentUnit: 4, tabSize: 4, indentWithTabs: false,
      matchBrackets: true, autoCloseBrackets: true,
      extraKeys: {
        "Cmd-Enter": runTests, "Ctrl-Enter": runTests,
        Tab: (cmInst) => cmInst.replaceSelection("    ", "end"),
      },
    });
    cm.on("change", () => { setSavedCode(getCode()); });
  } else {
    // fallback: plain textarea
    const ta = document.getElementById("editor");
    ta.style.display = "block";
    ta.addEventListener("input", () => setSavedCode(ta.value));
    ta.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runTests(); }
      else if (e.key === "Tab") {
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
    });
  }
}
function getCode() { return cm ? cm.getValue() : document.getElementById("editor").value; }
function setCode(src) {
  if (cm) cm.setValue(src);
  else document.getElementById("editor").value = src;
}

/* ============================================================
   PYODIDE — lazy boot + per-mode harness
   ============================================================ */
let pyReady = null;
function bootPyodide() { if (!pyReady) pyReady = loadPyodide(); return pyReady; }

// Problems: exec user class, then exec each test fn and call it. An
// AssertionError (or any exception) marks that case failed; capture a short
// message. cases payload is base64-wrapped JSON to dodge all quoting issues.
function harnessProblems(userCode, cases) {
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ user: userCode, cases: cases }))));
  return [
    "import json, base64, traceback",
    "__p__ = json.loads(base64.b64decode('" + payload + "').decode('utf-8'))",
    "__out__ = []",
    "__base__ = {}",
    "__load_err__ = None",
    "try:",
    "    exec(__p__['user'], __base__)",
    "except Exception:",
    "    __load_err__ = traceback.format_exc()",
    "for __c__ in __p__['cases']:",
    "    if __load_err__ is not None:",
    "        __out__.append({'func': __c__['func'], 'ok': False, 'msg': 'code did not load:\\n' + __load_err__})",
    "        continue",
    "    __ns__ = dict(__base__)",
    "    try:",
    "        exec(__c__['source'], __ns__)",
    "        __ns__[__c__['func']]()",
    "        __out__.append({'func': __c__['func'], 'ok': True, 'msg': ''})",
    "    except AssertionError:",
    "        __out__.append({'func': __c__['func'], 'ok': False, 'msg': 'Assertion failed:\\n' + traceback.format_exc()})",
    "    except Exception:",
    "        __out__.append({'func': __c__['func'], 'ok': False, 'msg': traceback.format_exc()})",
    "json.dumps({'results': __out__})",
  ].join("\n");
}

// Drills: same check()-collecting harness as leetcode-grind.
function harnessDrill(userCode, tests) {
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ user: userCode, tests: tests }))));
  return [
    "import json, base64, traceback",
    "__p__ = json.loads(base64.b64decode('" + payload + "').decode('utf-8'))",
    "__results__ = []",
    "def check(name, got, expected):",
    "    try: ok = (got == expected)",
    "    except Exception: ok = False",
    "    __results__.append({'name': name, 'ok': bool(ok), 'got': repr(got), 'expected': repr(expected)})",
    "__ns__ = {'check': check, '__results__': __results__}",
    "__error__ = None",
    "try:",
    "    exec(__p__['user'], __ns__)",
    "    exec(__p__['tests'], __ns__)",
    "except Exception:",
    "    __error__ = traceback.format_exc()",
    "json.dumps({'results': __ns__['__results__'], 'error': __error__})",
  ].join("\n");
}

async function runTests() {
  const summary = document.getElementById("testsSummary");
  const body = document.getElementById("testsBody");
  const runBtn = document.getElementById("runBtn");
  const userCode = getCode();
  setSavedCode(userCode);
  if (!state.running && state.elapsed === 0) startTimer();   // auto-start clock

  summary.className = "tests-summary idle";
  summary.textContent = "Booting Python…";
  body.innerHTML = '<div class="console-line">First run downloads Pyodide (~6 MB) + CodeMirror; cached after.</div>';
  runBtn.disabled = true;
  let py;
  try { py = await bootPyodide(); }
  catch (e) {
    summary.className = "tests-summary fail"; summary.textContent = "Pyodide failed to load";
    body.innerHTML = '<div class="tdetail show err">' + esc(String(e)) + '\n\nNeeds network on first run.</div>';
    runBtn.disabled = false; return;
  }
  summary.textContent = "Running…";

  try {
    if (isProblems()) {
      const p = curProblem();
      const out = await py.runPythonAsync(harnessProblems(userCode, p.cases));
      renderProblemResults(JSON.parse(out).results, p);
    } else {
      const d = curDrill();
      const out = await py.runPythonAsync(harnessDrill(userCode, d.tests));
      renderDrillResults(JSON.parse(out));
    }
  } catch (e) {
    summary.className = "tests-summary fail"; summary.textContent = "Runtime error";
    body.innerHTML = '<div class="tdetail show err">' + esc(String(e)) + '</div>';
  }
  runBtn.disabled = false;
}

/* ============================================================
   RESULTS RENDERING
   ============================================================ */
function renderProblemResults(results, p) {
  state.lastResults = results;
  const byFunc = {};
  results.forEach(r => { byFunc[r.func] = r; });

  // mark per-level solved: a level passes if ALL its cases pass
  const levelCases = {};
  p.cases.forEach(c => { (levelCases[c.level] = levelCases[c.level] || []).push(c); });
  const solved = state.prog.solvedLevels[p.id] = state.prog.solvedLevels[p.id] || {};
  Object.keys(levelCases).forEach(lv => {
    const all = levelCases[lv].every(c => byFunc[c.func] && byFunc[c.func].ok);
    if (all) solved[lv] = true;
  });
  save();

  const passed = results.filter(r => r.ok).length;
  const summary = document.getElementById("testsSummary");
  summary.className = "tests-summary " + (passed === results.length ? "pass" : "fail");
  summary.textContent = "✓ " + passed + " / " + results.length + " test cases passed";
  renderTestList(p.cases, byFunc);
  renderLevelTabs();
  renderPicker();
}

function renderDrillResults(parsed) {
  const summary = document.getElementById("testsSummary");
  const body = document.getElementById("testsBody");
  if (parsed.error) {
    summary.className = "tests-summary fail"; summary.textContent = "✗ Error";
    body.innerHTML = '<div class="tdetail show err">' + esc(parsed.error) + '</div>';
    return;
  }
  const results = parsed.results || [];
  const passed = results.filter(r => r.ok).length;
  const all = results.length > 0 && passed === results.length;
  summary.className = "tests-summary " + (all ? "pass" : "fail");
  summary.textContent = (all ? "✓ " : "✗ ") + passed + " / " + results.length + " tests passed";
  let html = "";
  results.forEach((r, idx) => {
    html += '<div class="tcase ' + (r.ok ? "ok" : "no") + '" data-detail="d' + idx + '">' +
      '<span class="mark">' + (r.ok ? "✓" : "✗") + '</span>' +
      '<span class="cname">' + esc(r.name) + '</span></div>' +
      '<div class="tdetail" id="d' + idx + '">' +
        (r.ok ? '<span class="src">passed</span>'
              : '<span class="err">got ' + esc(r.got) + '\nexpected ' + esc(r.expected) + '</span>') +
      '</div>';
  });
  body.innerHTML = html;
  if (all) { state.prog.solvedDrills[state.drillId] = true; save(); renderPicker(); }
  wireCaseClicks();
}

function renderTestList(cases, byFunc) {
  const body = document.getElementById("testsBody");
  let html = "";
  cases.forEach(c => {
    const r = byFunc ? byFunc[c.func] : null;
    const cls = !r ? "pending" : (r.ok ? "ok" : "no");
    const mark = !r ? "○" : (r.ok ? "✓" : "✗");
    html += '<div class="tcase ' + cls + '" data-detail="det_' + c.func + '">' +
      '<span class="mark">' + mark + '</span>' +
      '<span class="cname">' + esc(c.name) + '</span>' +
      '<span class="clevel">L' + c.level + '</span></div>' +
      '<div class="tdetail" id="det_' + c.func + '">' +
        (r && !r.ok ? '<span class="err">' + esc(r.msg) + '</span>\n\n' : '') +
        '<span class="src">' + esc(c.source) + '</span>' +
      '</div>';
  });
  body.innerHTML = html;
  wireCaseClicks();
}

function wireCaseClicks() {
  document.querySelectorAll(".tcase").forEach(el => {
    el.onclick = () => {
      const d = document.getElementById(el.dataset.detail);
      if (d) {
        const open = d.classList.contains("show");
        document.querySelectorAll(".tdetail").forEach(x => x.classList.remove("show"));
        document.querySelectorAll(".tcase").forEach(x => x.classList.remove("sel"));
        if (!open) { d.classList.add("show"); el.classList.add("sel"); }
      }
    };
  });
}

/* ============================================================
   STATEMENT / TABS / EDITOR RENDER
   ============================================================ */
function renderStatement() {
  const el = document.getElementById("statement");
  if (isProblems()) {
    const p = curProblem();
    el.innerHTML =
      '<div class="stmt-title">' + esc(p.title) + '</div>' +
      '<div class="stmt-meta"><span class="tag cat">4-Level IMC</span>' +
        '<span class="tag diff ' + p.difficulty + '">' + esc(p.difficulty) + '</span></div>' +
      '<div class="stmt-body">' + renderMarkdown(p.statement) + '</div>';
  } else {
    const d = curDrill();
    el.innerHTML =
      '<div class="stmt-title">' + esc(d.title) + '</div>' +
      '<div class="stmt-meta"><span class="tag cat">' + esc(d.category) + '</span>' +
        '<span class="tag diff ' + d.difficulty + '">' + esc(d.difficulty) + '</span></div>' +
      '<div class="pattern-note"><b>Pattern:</b> ' + esc(d.pattern) + '</div>' +
      '<div class="stmt-body"><pre><code>' + esc(d.description) + '</code></pre></div>';
  }
}

function renderLevelTabs() {
  const tabs = document.getElementById("levelTabs");
  if (isProblems()) {
    const p = curProblem();
    const solved = state.prog.solvedLevels[p.id] || {};
    const levels = Array.from(new Set(p.cases.map(c => c.level))).sort();
    let html = "";
    levels.forEach(lv => {
      html += '<button class="level-tab ' + (lv === state.level ? "active" : "") + '" data-level="' + lv + '">' +
        'Level ' + lv + (solved[lv] ? '<span class="lcheck">✓</span>' : '') + '</button>';
    });
    html += '<div class="tab-tools">' +
      '<button class="tool-btn" id="revealBtn">Reference solution</button>' +
      '<button class="tool-btn" id="resetBtn">Reset code</button></div>';
    tabs.innerHTML = html;
    tabs.querySelectorAll(".level-tab").forEach(t => {
      t.onclick = () => { state.level = t.dataset.level; renderLevelTabs(); scrollToLevel(t.dataset.level); };
    });
  } else {
    tabs.innerHTML = '<button class="level-tab active">Solve</button>' +
      '<div class="tab-tools">' +
      '<button class="tool-btn" id="revealBtn">Reference solution</button>' +
      '<button class="tool-btn" id="resetBtn">Reset code</button></div>';
  }
  document.getElementById("revealBtn").onclick = revealSolution;
  document.getElementById("resetBtn").onclick = resetCode;
}

// Scroll the statement pane to a level's heading when its tab is clicked.
function scrollToLevel(lv) {
  const headings = document.querySelectorAll("#statement .stmt-body h2");
  for (const h of headings) {
    if (h.textContent.toLowerCase().includes("level " + lv)) {
      h.scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    }
  }
}

function revealSolution() {
  const src = isProblems() ? curProblem().solution : curDrill().solution;
  const explain = isProblems() ? "" : ("\n\n# --- Approach ---\n# " + curDrill().explanation.replace(/\n/g, "\n# "));
  if (confirm("Load the reference solution into the editor? This replaces your current code (it's saved per-problem, so reset to get the stub back).")) {
    setCode(src + explain);
    setSavedCode(getCode());
  }
}
function resetCode() {
  const stub = isProblems() ? curProblem().starter : curDrill().starter;
  setCode(stub);
  setSavedCode(stub);
}

function loadEditor() {
  const saved = savedCode();
  const stub = isProblems() ? curProblem().starter : curDrill().starter;
  setCode((saved !== undefined && saved !== null) ? saved : stub);
}

/* ============================================================
   PICKER DRAWER
   ============================================================ */
function renderPickerLabel() {
  const lbl = document.getElementById("pickerLabel");
  if (isProblems()) { const p = curProblem(); lbl.textContent = p ? p.title : "—"; }
  else { const d = curDrill(); lbl.textContent = d ? (d.category + " · " + d.title) : "—"; }
}
function renderPicker() {
  const list = document.getElementById("drawerList");
  document.getElementById("drawerTitle").textContent = isProblems() ? "4-Level Problems" : "Drills";
  let html = "";
  if (isProblems()) {
    DATA.problems.forEach(p => {
      const solved = state.prog.solvedLevels[p.id] || {};
      const levels = Array.from(new Set(p.cases.map(c => c.level)));
      const done = levels.every(lv => solved[lv]);
      html += '<div class="ditem ' + (p.id === state.probId ? "active" : "") + '" data-id="' + p.id + '">' +
        '<span class="dtick">' + (done ? "✓" : "") + '</span>' +
        '<span class="dtitle">' + esc(p.title) + '</span>' +
        '<span class="ddiff ' + p.difficulty + '">' + esc(p.difficulty) + '</span></div>';
    });
  } else {
    const order = [], byCat = {};
    DATA.drills.forEach(d => { if (!byCat[d.category]) { byCat[d.category] = []; order.push(d.category); } byCat[d.category].push(d); });
    order.forEach(cat => {
      html += '<div class="drawer-group">' + esc(cat) + '</div>';
      byCat[cat].forEach(d => {
        const solved = state.prog.solvedDrills[d.id];
        html += '<div class="ditem ' + (d.id === state.drillId ? "active" : "") + '" data-id="' + d.id + '">' +
          '<span class="dtick">' + (solved ? "✓" : "") + '</span>' +
          '<span class="dtitle">' + esc(d.title) + '</span>' +
          '<span class="ddiff ' + d.difficulty + '">' + esc(d.difficulty) + '</span></div>';
      });
    });
  }
  list.innerHTML = html;
  list.querySelectorAll(".ditem").forEach(el => {
    el.onclick = () => {
      if (isProblems()) state.probId = el.dataset.id; else state.drillId = el.dataset.id;
      state.level = "1";
      closeDrawer();
      selectCurrent();
    };
  });
}
function openDrawer() { renderPicker(); document.getElementById("drawer").classList.add("open"); document.getElementById("drawerBg").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawerBg").classList.remove("open"); }

/* ============================================================
   TIMER (count-up stopwatch)
   ============================================================ */
function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  const h = Math.floor(m / 60), mm = m % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return (h > 0 ? pad(h) + ":" : "") + pad(h > 0 ? mm : m) + ":" + pad(sec);
}
function renderTimer() {
  document.getElementById("timerVal").textContent = fmtTime(state.elapsed);
  document.getElementById("timer").classList.toggle("running", state.running);
}
function startTimer() {
  if (state.running) return;
  state.running = true;
  state._tick = setInterval(() => { state.elapsed += 1; renderTimer(); }, 1000);
  renderTimer();
}
function pauseTimer() { state.running = false; if (state._tick) clearInterval(state._tick); state._tick = null; renderTimer(); }
function toggleTimer() { state.running ? pauseTimer() : startTimer(); }
function resetTimer() { pauseTimer(); state.elapsed = 0; renderTimer(); }

/* ============================================================
   MODE SWITCH + SELECT
   ============================================================ */
function selectCurrent() {
  renderStatement();
  renderLevelTabs();
  loadEditor();
  renderPickerLabel();
  // reset test panel
  document.getElementById("testsSummary").className = "tests-summary idle";
  document.getElementById("testsSummary").textContent = "Not run yet";
  if (isProblems()) {
    renderTestList(curProblem().cases, null);
  } else {
    document.getElementById("testsBody").innerHTML =
      '<div class="console-line">Press Run Tests (or Ctrl/Cmd+Enter) to check your solution.</div>';
  }
}
function setMode(m) {
  state.mode = m;
  document.getElementById("modeProblems").classList.toggle("active", m === "problems");
  document.getElementById("modeDrills").classList.toggle("active", m === "drills");
  selectCurrent();
}

/* ============================================================
   EVENTS + BOOT
   ============================================================ */
document.getElementById("modeProblems").onclick = () => setMode("problems");
document.getElementById("modeDrills").onclick = () => setMode("drills");
document.getElementById("runBtn").onclick = runTests;
document.getElementById("pickerBtn").onclick = openDrawer;
document.getElementById("drawerClose").onclick = closeDrawer;
document.getElementById("drawerBg").onclick = closeDrawer;
document.getElementById("timer").onclick = toggleTimer;
document.getElementById("timer").ondblclick = resetTimer;

load();
initEditor();
renderTimer();
setMode("problems");
</script>
</body>
