<!DOCTYPE html>
<!--
================================================================================
  LeetCode Grind — Python pattern drills (in-browser execution via Pyodide)
================================================================================

  Single-file vanilla HTML/CSS/JS. Open in a browser. ONE external dependency:
  Pyodide (CPython in WASM) loaded from a CDN so your code actually RUNS and is
  graded against real test cases — like LeetCode. First open needs network to
  fetch Pyodide (~6 MB, cached after). Everything else is self-contained.

  NOTE: this is the only file in codesignal-prep/ that touches the network; the
  rest of the kit is offline. That tradeoff buys true pass/fail execution.

  WHAT IT IS
  ==============================================================================
  A LeetCode-style grinder: a filterable problem list on the left, a
  Description / Solution tab pair, a code editor, and a Run button that executes
  your Python in the browser and shows per-test pass/fail. Built to drill
  pattern recognition + muscle memory across two tracks:
    - Broad LeetCode patterns (hash map, two pointers, sliding window, stack,
      binary search, strings, math, intervals, design).
    - The IMC stateful-class genre this prep kit targets (counter/grouping
      idioms, top-N tie-breaks, TTL/expiry, deepcopy snapshots, `and`
      short-circuit order) — see blank-line-drills.md.

  Every solution + expected output in here was executed in CPython by the
  generator (gen_grind.py) before shipping — no unverified expected values.

  FILE INDEX
  ==============================================================================
  HEAD            this comment + <head> meta/title + Pyodide <script> tag
  STYLE           palette (slate + python-blue + amber), layout (sidebar+main),
                  problem list, tabs, editor, run console, responsive
  BODY            .app = .sidebar (filters + problem list) + .main
                  (.tabs, .pane-desc, .pane-solution, .editor, .console)
  SCRIPT
    PROBLEMS      injected array: {id,title,difficulty,category,pattern,
                  description,starter,solution,explanation,tests}
    State         current problem id, per-problem saved code + solved flag
    Persistence   localStorage['csprep_grind_v1']
    Pyodide       lazy boot on first Run; harness wraps user code + tests,
                  collects check() results, reports pass/fail
    Render        sidebar list (grouped, solved ticks), tabs, editor, console
    Events        select problem, tab switch, run, reset code, filters
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Grind — Python Patterns</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --panel-2: #273449;
  --ink: #e2e8f0; --muted: #94a3b8;
  --blue: #4b8bbe; --blue-bright: #5fa8e0; --amber: #ffd43b;
  --green: #4ade80; --red: #f87171; --orange: #fb923c;
  --radius: 12px; --shadow: 0 8px 24px rgba(0,0,0,.35);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans); background: var(--bg); color: var(--ink);
  line-height: 1.5; overflow: hidden;
}

/* ===== App shell: sidebar + main ===== */
.app { display: flex; height: 100vh; }
.sidebar {
  width: 320px; flex: 0 0 320px; background: var(--panel);
  border-right: 1px solid #2c3a52; display: flex; flex-direction: column;
}
.main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }

/* ===== Sidebar ===== */
.brand {
  padding: 16px 18px 12px; font-weight: 700; font-size: 1.1rem;
  border-bottom: 1px solid #2c3a52;
}
.brand .lc { color: var(--blue-bright); }
.brand .py { color: var(--amber); }
.brand .sub { display: block; font-weight: 400; font-size: .72rem; color: var(--muted); margin-top: 3px; }
.filters { padding: 12px 14px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #2c3a52; }
.filters select {
  flex: 1 1 0; min-width: 0; font-family: var(--sans); font-size: .8rem;
  background: var(--panel-2); color: var(--ink); border: 1px solid #38476080;
  border-radius: 8px; padding: 6px 8px; cursor: pointer;
}
.progress-line { padding: 8px 18px; font-size: .76rem; color: var(--muted); border-bottom: 1px solid #2c3a52; }
.progress-line b { color: var(--green); }
.plist { flex: 1 1 auto; overflow-y: auto; padding: 6px 0 24px; }
.group-head {
  padding: 12px 18px 4px; font-size: .68rem; text-transform: uppercase;
  letter-spacing: .8px; color: var(--blue-bright); font-weight: 700;
}
.pitem {
  display: flex; align-items: center; gap: 9px; padding: 8px 18px;
  cursor: pointer; font-size: .86rem; border-left: 3px solid transparent;
}
.pitem:hover { background: var(--panel-2); }
.pitem.active { background: var(--panel-2); border-left-color: var(--blue); }
.pitem .tick { width: 15px; flex: 0 0 15px; color: var(--green); font-size: .85rem; }
.pitem .ptitle { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem.active .ptitle { color: #fff; font-weight: 600; }
.diff { font-size: .66rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; flex: 0 0 auto; }
.diff.Easy { color: var(--green); background: #14361f; }
.diff.Medium { color: var(--orange); background: #3a2410; }

/* ===== Main: tabs ===== */
.tabs {
  display: flex; align-items: center; gap: 4px; padding: 0 14px;
  border-bottom: 1px solid #2c3a52; background: var(--panel);
}
.tab {
  font-family: var(--sans); font-size: .85rem; color: var(--muted);
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 13px 14px; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--blue); font-weight: 600; }
.tab-spacer { flex: 1 1 auto; }
.run-btn {
  font-family: var(--sans); font-size: .85rem; font-weight: 700; color: #06240f;
  background: var(--green); border: none; border-radius: 8px;
  padding: 8px 18px; cursor: pointer; margin: 7px 0;
}
.run-btn:hover { filter: brightness(1.08); }
.run-btn:disabled { opacity: .55; cursor: default; }
.ghost-btn {
  font-family: var(--sans); font-size: .78rem; color: var(--muted);
  background: var(--panel-2); border: 1px solid #38476080; border-radius: 8px;
  padding: 7px 12px; cursor: pointer; margin: 7px 6px 7px 0;
}
.ghost-btn:hover { color: var(--ink); }

/* ===== Content panes ===== */
.content { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.pane { display: none; overflow-y: auto; padding: 22px 26px; }
.pane.active { display: block; }
.pane.text-pane { flex: 1 1 auto; }
.ptitle-big { font-size: 1.45rem; font-weight: 700; margin-bottom: 8px; }
.meta-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.cat-tag {
  font-size: .7rem; text-transform: uppercase; letter-spacing: .6px;
  color: var(--blue-bright); background: #12203a; border: 1px solid #1e3a5f;
  padding: 3px 9px; border-radius: 6px;
}
.pattern-note {
  background: #15233c; border-left: 3px solid var(--amber); border-radius: 6px;
  padding: 10px 14px; margin-bottom: 18px; font-size: .9rem; color: #d8e2f0;
}
.pattern-note b { color: var(--amber); }
.desc-body { white-space: pre-wrap; font-size: .96rem; color: #d8e2f0; }
.desc-body, .explain-body { font-family: var(--sans); }
.explain-body { white-space: pre-wrap; font-size: .95rem; color: #d8e2f0; margin-top: 6px; }
.section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 6px; }
pre, code { font-family: var(--mono); }
pre.code-block {
  background: #0b1220; border: 1px solid #1e2c44; border-radius: 10px;
  padding: 14px 16px; overflow-x: auto; font-size: .9rem; color: #e6edf3;
  white-space: pre; line-height: 1.55;
}
.locked-note { color: var(--muted); font-style: italic; font-size: .9rem; }

/* ===== Code editor + console (Code tab) ===== */
.pane-code { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
.pane-code.active { display: flex; }
.editor-wrap { flex: 1 1 60%; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px 0; }
.editor {
  flex: 1 1 auto; width: 100%; resize: none; tab-size: 4;
  font-family: var(--mono); font-size: .92rem; line-height: 1.55;
  background: #0b1220; color: #e6edf3; border: 1px solid #1e2c44;
  border-radius: 10px; padding: 14px 16px; white-space: pre; overflow: auto;
}
.editor:focus { outline: 1px solid var(--blue); }
.console {
  flex: 0 0 auto; max-height: 38%; overflow-y: auto; margin: 12px 16px 16px;
  background: #0b1220; border: 1px solid #1e2c44; border-radius: 10px;
  padding: 13px 16px; font-family: var(--mono); font-size: .85rem;
}
.console .status { color: var(--muted); }
.console .summary { font-weight: 700; margin-bottom: 8px; }
.console .summary.pass { color: var(--green); }
.console .summary.fail { color: var(--red); }
.test-row { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
.test-row .mark { flex: 0 0 16px; }
.test-row.ok .mark { color: var(--green); }
.test-row.no .mark { color: var(--red); }
.test-row .tname { color: var(--ink); }
.test-row .detail { color: var(--muted); }
.test-row.no .detail { color: #fbc4c4; }
.err-trace { color: var(--red); white-space: pre-wrap; }

/* ===== Responsive ===== */
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { flex-direction: column; height: auto; }
  .sidebar { width: 100%; flex: none; max-height: 38vh; }
  .main { height: 62vh; }
}
</style>
</head>
<body>
<div class="app">
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="lc">LeetCode</span> <span class="py">Grind</span>
      <span class="sub">Python patterns + IMC stateful-class drills · runs in-browser</span>
    </div>
    <div class="filters">
      <select id="catFilter" aria-label="Category"></select>
      <select id="diffFilter" aria-label="Difficulty">
        <option value="All">All levels</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
      </select>
    </div>
    <div class="progress-line" id="progressLine"></div>
    <div class="plist" id="plist"></div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <section class="main">
    <div class="tabs">
      <button class="tab active" data-tab="desc" id="tabDesc">Description</button>
      <button class="tab" data-tab="code" id="tabCode">Code</button>
      <button class="tab" data-tab="solution" id="tabSolution">Solution</button>
      <span class="tab-spacer"></span>
      <button class="ghost-btn" id="resetCodeBtn">Reset code</button>
      <button class="run-btn" id="runBtn">▶ Run</button>
    </div>
    <div class="content">
      <!-- Description -->
      <div class="pane text-pane active" id="paneDesc"></div>
      <!-- Code editor + console -->
      <div class="pane-code" id="paneCode">
        <div class="editor-wrap">
          <textarea class="editor" id="editor" spellcheck="false"
            autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        </div>
        <div class="console" id="console">
          <span class="status">Write your solution, then press Run (Ctrl/Cmd+Enter). Pyodide loads on first run.</span>
        </div>
      </div>
      <!-- Solution -->
      <div class="pane text-pane" id="paneSolution"></div>
    </div>
  </section>
</div>

<script>
/* ============================================================
   PROBLEMS — injected by gen_grind.py (verified in CPython).
   ============================================================ */
const PROBLEMS = [
{
"id": "two-sum",
"title": "Two Sum",
"difficulty": "Easy",
"category": "Hash Map",
"pattern": "Remember what you've seen in a dict; look up the complement.",
"description": "Given an array of integers `nums` and an integer `target`, return the indices of the two numbers that add up to `target`. Exactly one solution exists; you may not use the same element twice.\n\nExample:\n  two_sum([2,7,11,15], 9) -> [0, 1]   (2 + 7 = 9)\n  two_sum([3,2,4], 6)     -> [1, 2]",
"starter": "def two_sum(nums, target):\n    # return the two indices\n    pass\n",
"solution": "def two_sum(nums, target):\n    seen = {}                      # value -> index\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return [seen[target - n], i]\n        seen[n] = i\n    return []\n",
"explanation": "One pass. For each number, check if its complement (target - n) was already seen; if so you have the pair. Store value->index as you go.\nTime O(n), space O(n). The brute-force double loop is O(n^2).",
"tests": "check(\"ex1\", two_sum([2,7,11,15], 9), [0,1])\ncheck(\"ex2\", two_sum([3,2,4], 6), [1,2])\ncheck(\"dup\", two_sum([3,3], 6), [0,1])\n"
},
{
"id": "contains-duplicate",
"title": "Contains Duplicate",
"difficulty": "Easy",
"category": "Hash Map",
"pattern": "set() collapses duplicates; compare lengths.",
"description": "Return True if any value appears at least twice in `nums`, False if every element is distinct.\n\nExample:\n  contains_duplicate([1,2,3,1]) -> True\n  contains_duplicate([1,2,3,4]) -> False",
"starter": "def contains_duplicate(nums):\n    pass\n",
"solution": "def contains_duplicate(nums):\n    return len(set(nums)) != len(nums)\n",
"explanation": "A set drops duplicates, so if the set is smaller than the list a duplicate existed. Time O(n), space O(n).",
"tests": "check(\"dup\", contains_duplicate([1,2,3,1]), True)\ncheck(\"nodup\", contains_duplicate([1,2,3,4]), False)\ncheck(\"empty\", contains_duplicate([]), False)\n"
},
{
"id": "valid-anagram",
"title": "Valid Anagram",
"difficulty": "Easy",
"category": "Hash Map",
"pattern": "Two strings are anagrams iff their char counts match.",
"description": "Return True if `t` is an anagram of `s` (same characters, same counts, any order).\n\nExample:\n  is_anagram(\"anagram\", \"nagaram\") -> True\n  is_anagram(\"rat\", \"car\")         -> False",
"starter": "def is_anagram(s, t):\n    pass\n",
"solution": "from collections import Counter\n\ndef is_anagram(s, t):\n    return Counter(s) == Counter(t)\n",
"explanation": "Counter builds char->count; two anagrams have identical Counters. Equivalent: sorted(s) == sorted(t). Time O(n).",
"tests": "check(\"yes\", is_anagram(\"anagram\", \"nagaram\"), True)\ncheck(\"no\", is_anagram(\"rat\", \"car\"), False)\ncheck(\"len\", is_anagram(\"a\", \"ab\"), False)\n"
},
{
"id": "group-anagrams",
"title": "Group Anagrams",
"difficulty": "Medium",
"category": "Hash Map",
"pattern": "Bucket by a canonical key (sorted letters) \u2014 grouping idiom.",
"description": "Group the strings that are anagrams of each other. Return a list of groups (order of groups and within groups doesn't matter).\n\nExample:\n  group_anagrams([\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"])\n    -> [[\"eat\",\"tea\",\"ate\"], [\"tan\",\"nat\"], [\"bat\"]]",
"starter": "def group_anagrams(strs):\n    pass\n",
"solution": "def group_anagrams(strs):\n    groups = {}                       # sorted-key -> [words]\n    for s in strs:\n        key = \"\".join(sorted(s))\n        groups.setdefault(key, []).append(s)\n    return list(groups.values())\n",
"explanation": "All anagrams share the same sorted-letters string, so use it as a dict key and append each word to its bucket. This is the grouping idiom (setdefault) \u2014 a comprehension can't accumulate buckets. Time O(n * k log k).",
"tests": "def norm(res):\n    return sorted(sorted(g) for g in res)\ncheck(\"ex1\", norm(group_anagrams([\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"])), norm([[\"eat\",\"tea\",\"ate\"],[\"tan\",\"nat\"],[\"bat\"]]))\ncheck(\"single\", norm(group_anagrams([\"abc\"])), [[\"abc\"]])\ncheck(\"empty\", group_anagrams([]), [])\n"
},
{
"id": "top-k-frequent",
"title": "Top K Frequent Elements",
"difficulty": "Medium",
"category": "Hash Map",
"pattern": "Counter.most_common(k) \u2014 count then take the top.",
"description": "Return the `k` most frequent elements of `nums` (any order).\n\nExample:\n  top_k_frequent([1,1,1,2,2,3], 2) -> [1, 2]\n  top_k_frequent([1], 1)           -> [1]",
"starter": "def top_k_frequent(nums, k):\n    pass\n",
"solution": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    counts = Counter(nums)\n    return [n for n, _ in counts.most_common(k)]\n",
"explanation": "Count frequencies, then most_common(k) returns the k highest-count (value, count) pairs; strip the value. Time O(n log k).",
"tests": "check(\"ex1\", sorted(top_k_frequent([1,1,1,2,2,3], 2)), [1,2])\ncheck(\"one\", top_k_frequent([1], 1), [1])\ncheck(\"all\", sorted(top_k_frequent([4,4,5,5,6], 3)), [4,5,6])\n"
},
{
"id": "first-unique-char",
"title": "First Unique Character",
"difficulty": "Easy",
"category": "Hash Map",
"pattern": "Count first, then scan in order for the first count==1.",
"description": "Return the index of the first non-repeating character in `s`, or -1 if there is none.\n\nExample:\n  first_uniq_char(\"leetcode\")   -> 0\n  first_uniq_char(\"loveleetcode\") -> 2\n  first_uniq_char(\"aabb\")       -> -1",
"starter": "def first_uniq_char(s):\n    pass\n",
"solution": "from collections import Counter\n\ndef first_uniq_char(s):\n    counts = Counter(s)\n    for i, c in enumerate(s):\n        if counts[c] == 1:\n            return i\n    return -1\n",
"explanation": "First pass counts each char; second pass returns the index of the first char whose count is 1. Order matters, so scan the original string, not the dict. Time O(n).",
"tests": "check(\"ex1\", first_uniq_char(\"leetcode\"), 0)\ncheck(\"ex2\", first_uniq_char(\"loveleetcode\"), 2)\ncheck(\"none\", first_uniq_char(\"aabb\"), -1)\n"
},
{
"id": "valid-palindrome",
"title": "Valid Palindrome",
"difficulty": "Easy",
"category": "Two Pointers",
"pattern": "Filter to alphanumerics, compare with its reverse.",
"description": "Return True if `s` reads the same forwards and backwards, considering only alphanumeric characters and ignoring case.\n\nExample:\n  is_palindrome(\"A man, a plan, a canal: Panama\") -> True\n  is_palindrome(\"race a car\")                     -> False",
"starter": "def is_palindrome(s):\n    pass\n",
"solution": "def is_palindrome(s):\n    cleaned = [c.lower() for c in s if c.isalnum()]\n    return cleaned == cleaned[::-1]\n",
"explanation": "Keep only alphanumerics (lowercased), then check it equals its reverse. cleaned[::-1] reverses. Time O(n). A two-pointer scan avoids building the reversed copy but the slice is simpler.",
"tests": "check(\"yes\", is_palindrome(\"A man, a plan, a canal: Panama\"), True)\ncheck(\"no\", is_palindrome(\"race a car\"), False)\ncheck(\"empty\", is_palindrome(\" \"), True)\n"
},
{
"id": "two-sum-ii",
"title": "Two Sum II (Sorted Input)",
"difficulty": "Medium",
"category": "Two Pointers",
"pattern": "Sorted array -> converge two pointers by comparing the sum.",
"description": "`numbers` is sorted ascending. Return the 1-indexed positions of the two numbers that add to `target` as [i, j] with i < j.\n\nExample:\n  two_sum_sorted([2,7,11,15], 9)  -> [1, 2]\n  two_sum_sorted([2,3,4], 6)      -> [1, 3]",
"starter": "def two_sum_sorted(numbers, target):\n    pass\n",
"solution": "def two_sum_sorted(numbers, target):\n    lo, hi = 0, len(numbers) - 1\n    while lo < hi:\n        s = numbers[lo] + numbers[hi]\n        if s == target:\n            return [lo + 1, hi + 1]\n        if s < target:\n            lo += 1\n        else:\n            hi -= 1\n    return []\n",
"explanation": "Because the array is sorted, a too-small sum means move the left pointer up; too-big means move the right pointer down. Converge in one pass. Time O(n), space O(1).",
"tests": "check(\"ex1\", two_sum_sorted([2,7,11,15], 9), [1,2])\ncheck(\"ex2\", two_sum_sorted([2,3,4], 6), [1,3])\ncheck(\"ex3\", two_sum_sorted([-1,0], -1), [1,2])\n"
},
{
"id": "move-zeroes",
"title": "Move Zeroes",
"difficulty": "Easy",
"category": "Two Pointers",
"pattern": "Write pointer packs non-zeros forward; fill the rest with zeros.",
"description": "Move all 0's to the end of `nums` while keeping the order of the non-zero elements. Modify in place and return the list.\n\nExample:\n  move_zeroes([0,1,0,3,12]) -> [1,3,12,0,0]",
"starter": "def move_zeroes(nums):\n    pass\n",
"solution": "def move_zeroes(nums):\n    w = 0                          # next write slot\n    for n in nums:\n        if n != 0:\n            nums[w] = n\n            w += 1\n    for i in range(w, len(nums)):\n        nums[i] = 0\n    return nums\n",
"explanation": "Two pointers: copy each non-zero to the front (write pointer w), then zero-fill the tail. Stable and in place. Time O(n), space O(1).",
"tests": "check(\"ex1\", move_zeroes([0,1,0,3,12]), [1,3,12,0,0])\ncheck(\"nozeros\", move_zeroes([1,2,3]), [1,2,3])\ncheck(\"allzeros\", move_zeroes([0,0]), [0,0])\n"
},
{
"id": "remove-duplicates-sorted",
"title": "Remove Duplicates from Sorted Array",
"difficulty": "Easy",
"category": "Two Pointers",
"pattern": "Slow/fast pointers; write each new value once.",
"description": "`nums` is sorted ascending. Remove duplicates in place so each value appears once, and return k = the number of unique elements. The first k slots of nums must hold the unique values in order.\n\nReturn k here (the harness checks both k and nums[:k]).\n\nExample:\n  remove_duplicates([1,1,2]) -> 2, nums[:2] == [1,2]",
"starter": "def remove_duplicates(nums):\n    pass\n",
"solution": "def remove_duplicates(nums):\n    if not nums:\n        return 0\n    w = 1                          # next write slot\n    for i in range(1, len(nums)):\n        if nums[i] != nums[w - 1]:\n            nums[w] = nums[i]\n            w += 1\n    return w\n",
"explanation": "Sorted means duplicates are adjacent. Keep a write pointer; whenever the current value differs from the last written one, write it. Returns the unique count. Time O(n), space O(1).",
"tests": "a = [1,1,2]\ncheck(\"k\", remove_duplicates(a), 2)\ncheck(\"front\", a[:2], [1,2])\nb = [0,0,1,1,1,2,2,3,3,4]\ncheck(\"k2\", remove_duplicates(b), 5)\ncheck(\"front2\", b[:5], [0,1,2,3,4])\n"
},
{
"id": "container-most-water",
"title": "Container With Most Water",
"difficulty": "Medium",

"starter": "def search_rotated(nums, target):\n    pass\n",
"solution": "def search_rotated(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:           # left half sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                               # right half sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1\n",

},

"description": "Design a stack supporting push, pop, top and get_min \u2014 all O(1).\n\n  MinStack()        # empty\n  push(val)         # push val\n  pop()             # remove top\n  top()             # return top value\n  get_min()         # return the minimum value in the stack\n\nExample:\n  s = MinStack(); s.push(-2); s.push(0); s.push(-3)\n  s.get_min() -> -3;  s.pop();  s.top() -> 0;  s.get_min() -> -2",

"solution": "class MinStack:\n    def __init__(self):\n        self.stack = []            # (value, min-so-far)\n\n    def push(self, val):\n        cur_min = val if not self.stack else min(val, self.stack[-1][1])\n        self.stack.append((val, cur_min))\n\n    def pop(self):\n        self.stack.pop()\n\n    def top(self):\n        return self.stack[-1][0]\n\n    def get_min(self):\n        return self.stack[-1][1]\n",

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const LS_KEY = "csprep_grind_v1";
const state = {
  curId: PROBLEMS[0] ? PROBLEMS[0].id : null,
  tab: "desc",
  category: "All",
  difficulty: "All",
  solvedSeen: false,         // has the user opened the Solution tab this problem
  // persisted: id -> { code: string, solved: bool }
  prog: {},
};

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) state.prog = JSON.parse(raw) || {};
  } catch (e) { state.prog = {}; }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state.prog)); } catch (e) {}
}
function prog(id) {
  if (!state.prog[id]) state.prog[id] = { code: null, solved: false };
  return state.prog[id];
}
function getProblem(id) { return PROBLEMS.find(p => p.id === id); }

/* ============================================================
   PYODIDE — lazy boot; run user code + tests, collect results
   ============================================================ */
let pyodideReady = null;     // promise, set on first run
function bootPyodide() {
  if (!pyodideReady) {
    pyodideReady = loadPyodide();
  }
  return pyodideReady;
}

// The harness: define check() to collect results, run user code, then tests,
// and hand back a JSON blob. User code and tests are base64-encoded so any
// quotes / newlines / triple-quotes survive the JS->Python hop untouched.
function buildHarness(userCode, tests) {
  // btoa needs latin1; encodeURIComponent->unescape makes UTF-8 safe.
  const b64 = btoa(unescape(encodeURIComponent(
    JSON.stringify({ user: userCode, tests: tests }))));
  return [
    "import json, base64, traceback",
    "__payload__ = json.loads(base64.b64decode('" + b64 + "').decode('utf-8'))",
    "__results__ = []",
    "def check(name, got, expected):",
    "    try:",
    "        ok = (got == expected)",
    "    except Exception:",
    "        ok = False",
    "    __results__.append({'name': name, 'ok': bool(ok),",
    "                        'got': repr(got), 'expected': repr(expected)})",
    "__ns__ = {'check': check, '__results__': __results__}",
    "__error__ = None",
    "try:",
    "    exec(__payload__['user'], __ns__)",
    "    exec(__payload__['tests'], __ns__)",
    "except Exception:",
    "    __error__ = traceback.format_exc()",
    "json.dumps({'results': __ns__['__results__'], 'error': __error__})",
  ].join("\n");
}

async function runCode() {
  const p = getProblem(state.curId);
  if (!p) return;
  const consoleEl = document.getElementById("console");
  const runBtn = document.getElementById("runBtn");
  const userCode = document.getElementById("editor").value;
  // persist code
  prog(p.id).code = userCode;
  save();

  consoleEl.innerHTML = '<span class="status">Booting Python (first run downloads Pyodide ~6 MB)…</span>';
  runBtn.disabled = true;
  let py;
  try {
    py = await bootPyodide();
  } catch (e) {
    consoleEl.innerHTML = '<span class="summary fail">Could not load Pyodide.</span>' +
      '<div class="err-trace">' + esc(String(e)) + '\n\nThis page needs network on first run to fetch the Python runtime.</div>';
    runBtn.disabled = false;
    return;
  }
  consoleEl.innerHTML = '<span class="status">Running…</span>';
  let parsed;
  try {
    const out = await py.runPythonAsync(buildHarness(userCode, p.tests));
    parsed = JSON.parse(out);
  } catch (e) {
    consoleEl.innerHTML = '<span class="summary fail">Runtime error</span>' +
      '<div class="err-trace">' + esc(String(e)) + '</div>';
    runBtn.disabled = false;
    return;
  }
  renderResults(parsed);
  runBtn.disabled = false;
}

function renderResults(parsed) {
  const consoleEl = document.getElementById("console");
  if (parsed.error) {
    consoleEl.innerHTML = '<span class="summary fail">✗ Error before tests finished</span>' +
      '<div class="err-trace">' + esc(parsed.error) + '</div>';
    return;
  }
  const results = parsed.results || [];
  const passed = results.filter(r => r.ok).length;
  const total = results.length;
  const allPass = total > 0 && passed === total;
  let html = '<div class="summary ' + (allPass ? "pass" : "fail") + '">' +
    (allPass ? "✓ " : "✗ ") + passed + " / " + total + " tests passed</div>";
  for (const r of results) {
    html += '<div class="test-row ' + (r.ok ? "ok" : "no") + '">' +
      '<span class="mark">' + (r.ok ? "✓" : "✗") + '</span>' +
      '<span class="tname">' + esc(r.name) + '</span>';
    if (!r.ok) {
      html += '<span class="detail">got ' + esc(r.got) + ' · expected ' + esc(r.expected) + '</span>';
    }
    html += '</div>';
  }
  consoleEl.innerHTML = html;
  if (allPass) {
    prog(state.curId).solved = true;
    save();
    renderSidebar();
    renderProgress();
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function visibleProblems() {
  return PROBLEMS.filter(p =>
    (state.category === "All" || p.category === state.category) &&
    (state.difficulty === "All" || p.difficulty === state.difficulty));
}

function renderProgress() {
  const solved = PROBLEMS.filter(p => prog(p.id).solved).length;
  document.getElementById("progressLine").innerHTML =
    "Solved <b>" + solved + "</b> / " + PROBLEMS.length;
}

function renderSidebar() {
  const list = visibleProblems();
  const plist = document.getElementById("plist");
  // group by category, preserving first-seen order
  const order = [];
  const byCat = {};
  for (const p of list) {
    if (!byCat[p.category]) { byCat[p.category] = []; order.push(p.category); }
    byCat[p.category].push(p);
  }
  let html = "";
  for (const cat of order) {
    html += '<div class="group-head">' + esc(cat) + '</div>';
    for (const p of byCat[cat]) {
      const solved = prog(p.id).solved;
      html += '<div class="pitem ' + (p.id === state.curId ? "active" : "") +
        '" data-id="' + p.id + '">' +
        '<span class="tick">' + (solved ? "✓" : "") + '</span>' +
        '<span class="ptitle">' + esc(p.title) + '</span>' +
        '<span class="diff ' + p.difficulty + '">' + p.difficulty + '</span>' +
        '</div>';
    }
  }
  if (!list.length) html = '<div class="group-head">No problems match the filters.</div>';
  plist.innerHTML = html;
  plist.querySelectorAll(".pitem").forEach(el => {
    el.onclick = () => selectProblem(el.dataset.id);
  });
}

function renderDesc() {
  const p = getProblem(state.curId);
  const pane = document.getElementById("paneDesc");
  if (!p) { pane.innerHTML = "Select a problem."; return; }
  pane.innerHTML =
    '<div class="ptitle-big">' + esc(p.title) + '</div>' +
    '<div class="meta-row">' +
      '<span class="cat-tag">' + esc(p.category) + '</span>' +
      '<span class="diff ' + p.difficulty + '">' + p.difficulty + '</span>' +
    '</div>' +
    '<div class="pattern-note"><b>Pattern:</b> ' + esc(p.pattern) + '</div>' +
    '<div class="desc-body">' + esc(p.description) + '</div>';
}

function renderSolution() {
  const p = getProblem(state.curId);
  const pane = document.getElementById("paneSolution");
  if (!p) { pane.innerHTML = ""; return; }
  pane.innerHTML =
    '<div class="ptitle-big">' + esc(p.title) + ' — Solution</div>' +
    '<div class="section-label">Reference solution</div>' +
    '<pre class="code-block">' + esc(p.solution) + '</pre>' +
    '<div class="section-label">Approach</div>' +
    '<div class="explain-body">' + esc(p.explanation) + '</div>';
}

function renderEditor() {
  const p = getProblem(state.curId);
  const ed = document.getElementById("editor");
  const saved = prog(p.id).code;
  ed.value = (saved !== null && saved !== undefined) ? saved : p.starter;
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === tab));
  document.getElementById("paneDesc").classList.toggle("active", tab === "desc");
  document.getElementById("paneCode").classList.toggle("active", tab === "code");
  document.getElementById("paneSolution").classList.toggle("active", tab === "solution");
  if (tab === "code") document.getElementById("editor").focus();
}

function selectProblem(id) {
  state.curId = id;
  renderSidebar();
  renderDesc();
  renderSolution();
  renderEditor();
  document.getElementById("console").innerHTML =
    '<span class="status">Write your solution, then press Run (Ctrl/Cmd+Enter).</span>';
  setTab("desc");
}

/* ============================================================
   INIT + EVENTS
   ============================================================ */
function initFilters() {
  const cats = ["All", ...Array.from(new Set(PROBLEMS.map(p => p.category)))];
  const sel = document.getElementById("catFilter");
  sel.innerHTML = cats.map(c =>
    '<option value="' + c + '">' + (c === "All" ? "All categories" : c) + '</option>').join("");
  sel.onchange = () => { state.category = sel.value; renderSidebar(); };
  document.getElementById("diffFilter").onchange = (e) => {
    state.difficulty = e.target.value; renderSidebar();
  };
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => setTab(t.dataset.tab);
});
document.getElementById("runBtn").onclick = runCode;
document.getElementById("resetCodeBtn").onclick = () => {
  const p = getProblem(state.curId);
  prog(p.id).code = null; save();
  renderEditor();
  setTab("code");
};
// Tab key inserts spaces in the editor; Cmd/Ctrl+Enter runs.
document.getElementById("editor").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + 4;
  } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    runCode();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
load();
initFilters();
renderProgress();
renderSidebar();
selectProblem(state.curId);
</script>
</body>
</html>
